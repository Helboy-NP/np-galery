<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-label="NP Galery smartphone home screen">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f7ff"/>
      <stop offset="0.55" stop-color="#ded7f7"/>
      <stop offset="1" stop-color="#aaa0cf"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbff"/>
      <stop offset="0.52" stop-color="#f4f0ff"/>
      <stop offset="1" stop-color="#ebe5fb"/>
    </linearGradient>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b72ff"/>
      <stop offset="0.5" stop-color="#b09cff"/>
      <stop offset="1" stop-color="#e5dfff"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".46"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#24184f" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="47" y="24" width="226" height="512" rx="38"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)" transform="rotate(5 160 280)">
    <rect x="35" y="12" width="250" height="536" rx="48" fill="url(#body)"/>
    <rect x="47" y="24" width="226" height="512" rx="38" fill="url(#screen)"/>

    <g clip-path="url(#screenClip)">
      <circle cx="252" cy="76" r="76" fill="#ffffff" opacity=".16" filter="url(#soft)"/>
      <circle cx="72" cy="490" r="92" fill="#8b72ff" opacity=".12" filter="url(#soft)"/>

      <!-- Status bar -->
      <text x="66" y="53" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#3a334d">9:41</text>
      <rect x="123" y="31" width="74" height="18" rx="9" fill="#17131f" opacity=".92"/>
      <circle cx="150" cy="40" r="4" fill="#6b6575"/>
      <circle cx="168" cy="40" r="3" fill="#6b6575" opacity=".72"/>
      <path d="M229 48h10M229 44h7M229 40h4" stroke="#3a334d" stroke-width="2" stroke-linecap="round" opacity=".72"/>

      <!-- NP Galery home-screen identity -->
      <rect x="67" y="72" width="186" height="156" rx="28" fill="url(#wallpaper)"/>
      <circle cx="226" cy="98" r="35" fill="#ffffff" opacity=".12"/>
      <circle cx="84" cy="214" r="46" fill="#ffffff" opacity=".09"/>

      <circle cx="160" cy="130" r="35" fill="#ffffff" opacity=".94"/>
      <image href="../logo-np.jpg" x="132" y="102" width="56" height="56" preserveAspectRatio="xMidYMid slice"/>
      <text x="160" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="-.5">NP Galery</text>
      <text x="160" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" font-weight="600" fill="#ffffff" opacity=".82">Phone Management</text>

      <!-- Home screen app icons -->
      <g>
        <rect x="67" y="246" width="42" height="42" rx="13" fill="#ffffff" opacity=".92"/>
        <rect x="117" y="246" width="42" height="42" rx="13" fill="#ffffff" opacity=".92"/>
        <rect x="167" y="246" width="42" height="42" rx="13" fill="#ffffff" opacity=".92"/>
        <rect x="217" y="246" width="36" height="42" rx="13" fill="#ffffff" opacity=".92"/>

        <circle cx="88" cy="267" r="10" fill="#8b72ff" opacity=".86"/>
        <path d="M84 267h8M88 263v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <rect x="129" y="258" width="18" height="18" rx="5" fill="#8b72ff" opacity=".86"/>
        <path d="M133 263h10M133 268h10M133 273h6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="188" cy="267" r="10" fill="#8b72ff" opacity=".86"/>
        <path d="M183 270l3-6 3 4 3-3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="226" y="258" width="18" height="18" rx="5" fill="#8b72ff" opacity=".86"/>
        <path d="M231 263h8M231 268h8M231 273h5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <text x="88" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" font-weight="700" fill="#6f6880">Stok</text>
      <text x="138" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" font-weight="700" fill="#6f6880">Catatan</text>
      <text x="188" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" font-weight="700" fill="#6f6880">Sales</text>
      <text x="235" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" font-weight="700" fill="#6f6880">AI</text>

      <!-- Subtle home-screen widget -->
      <rect x="67" y="324" width="186" height="84" rx="22" fill="#ffffff" opacity=".74"/>
      <text x="82" y="348" font-family="Arial,sans-serif" font-size="7" font-weight="700" fill="#817990">NP GALERY</text>
      <text x="82" y="374" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#312a43">Ready to manage</text>
      <circle cx="226" cy="366" r="15" fill="#8b72ff" opacity=".13"/>
      <circle cx="226" cy="366" r="6" fill="#8b72ff" opacity=".8"/>

      <!-- Dock -->
      <rect x="76" y="461" width="168" height="48" rx="20" fill="url(#dock)" stroke="#ffffff" stroke-opacity=".38"/>
      <circle cx="101" cy="485" r="13" fill="#ffffff" opacity=".9"/>
      <circle cx="143" cy="485" r="13" fill="#ffffff" opacity=".9"/>
      <circle cx="185" cy="485" r="13" fill="#ffffff" opacity=".9"/>
      <circle cx="227" cy="485" r="13" fill="#ffffff" opacity=".9"/>
      <circle cx="101" cy="485" r="6" fill="#8b72ff" opacity=".85"/>
      <path d="M137 485h12M143 479v12" stroke="#8b72ff" stroke-width="2" stroke-linecap="round"/>
      <path d="M180 489l5-8 5 8" fill="none" stroke="#8b72ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M222 481h10v8h-10z" fill="none" stroke="#8b72ff" stroke-width="2" rx="2"/>
    </g>
  </g>
</svg>
